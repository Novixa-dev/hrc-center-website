# Deploy hrc.novixa.dev to the shared Novixa VPS.
#
# Flow: verify (lint + typecheck + unit tests) → pnpm build (standalone) and
#       smoke-test it on the runner → package it in a Docker image → copy it to
#       the server over SSH → `docker compose up` in
#       /opt/hrc-center → install the site block in mailcow's nginx (only if it
#       changed; `nginx -t` first, previous file restored on failure).
#
# The VPS also hosts mailcow and other Novixa sites. This workflow only touches
# things named hrc-center*: /opt/hrc-center, the hrc-center-app container, the
# hrc-center-edge network and mailcow's conf.d/hrc-center{.conf,/}. nginx is
# reloaded gracefully, never restarted.
#
# Repository secrets: SSH_HOST, SSH_USER, SSH_PASSWORD (or SSH_KEY).
# Optional app secrets: RESEND_API_KEY, GEMINI_API_KEY, CONTACT_TO_EMAIL,
#   CONTACT_FROM_EMAIL, NEXT_PUBLIC_WHATSAPP, NEXT_PUBLIC_ANALYTICS.
# Optional repository variable: GEMINI_MODEL (defaults to gemini-2.5-flash).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  deploy:
    name: Deploy to hrc.novixa.dev
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://hrc.novixa.dev
    env:
      IMAGE: hrc-center-website
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        run: echo "APP_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      # Per-page OG cards are rendered by Chromium (satori cannot shape Arabic) and
      # must exist before the build so the metadata can point at them.
      - name: Generate per-page Open Graph images
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm og

      - name: Build Next.js (standalone)
        run: |
          set -o pipefail
          if ! pnpm build 2>&1 | tee build.log; then
            # Surface the failure as annotations (readable without log access).
            grep -iE 'error|failed|cannot|unable|module not found|type ?error' build.log \
              | grep -v '^\s*at ' | head -15 | sed 's/^/::error title=next build::/'
            exit 1
          fi
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://hrc.novixa.dev
          NEXT_PUBLIC_WHATSAPP: ${{ secrets.NEXT_PUBLIC_WHATSAPP }}
          NEXT_PUBLIC_ANALYTICS: ${{ secrets.NEXT_PUBLIC_ANALYTICS }}

      # standalone/ holds the server and traced node_modules only; static assets,
      # public/ and the markdown collections (read from disk at request time) are added here.
      - name: Assemble standalone bundle
        run: |
          S=.next/standalone
          # Merge (dir/.) rather than copy-into: output tracing may already have
          # placed some public/ files in the bundle, and `cp -r public $S/public`
          # would then nest them under $S/public/public.
          mkdir -p "$S/.next/static" "$S/public" "$S/src/content"
          cp -r .next/static/. "$S/.next/static/"
          cp -r public/. "$S/public/"
          cp -r src/content/. "$S/src/content/"
          du -sh "$S"

      - name: Smoke-test the bundle
        run: |
          cd .next/standalone
          PORT=3999 HOSTNAME=127.0.0.1 node server.js > /tmp/server.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3999/ar && break; sleep 1; done
          for p in /ar /en /ar/news /en/training /ar/contact /sitemap.xml /robots.txt /manifest.webmanifest /apple-touch-icon.png /icon-192.png /icon-512.png /icon-512-maskable.png /icon.svg /favicon.ico /og/ar/index.jpg /og/en/news.jpg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3999$p")
            echo "$p → $code"
            if [ "$code" != "200" ]; then
              # Annotations are readable without log access.
              echo "::error title=smoke test::$p returned $code"
              tail -15 /tmp/server.log | sed 's/^/::error title=server log::/'
              ls -la "public/og/ar" 2>&1 | head -5 | sed 's/^/::error title=bundle og dir::/'
              exit 1
            fi
          done
          kill "$PID"

      - name: Build image
        run: docker build -t "${IMAGE}:${APP_TAG}" .

      - name: Bundle release
        run: |
          mkdir -p release
          docker save "${IMAGE}:${APP_TAG}" | gzip -1 > release/image.tar.gz
          cp deploy/docker-compose.yml deploy/nginx/hrc-center.mailcow.conf release/
          ls -lh release

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          source: release/*
          target: /opt/hrc-center/incoming
          strip_components: 1
          overwrite: true

      - name: Release on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          ENV_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENV_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENV_GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          ENV_CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL || 'info@hrc-ahgaff.org' }}
          ENV_CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL || 'onboarding@resend.dev' }}
          ENV_NEXT_PUBLIC_WHATSAPP: ${{ secrets.NEXT_PUBLIC_WHATSAPP }}
          ENV_NEXT_PUBLIC_ANALYTICS: ${{ secrets.NEXT_PUBLIC_ANALYTICS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE,APP_TAG,ENV_RESEND_API_KEY,ENV_GEMINI_API_KEY,ENV_GEMINI_MODEL,ENV_CONTACT_TO_EMAIL,ENV_CONTACT_FROM_EMAIL,ENV_NEXT_PUBLIC_WHATSAPP,ENV_NEXT_PUBLIC_ANALYTICS
          script: |
            set -euo pipefail
            APP_DIR=/opt/hrc-center
            IN="${APP_DIR}/incoming"
            MC_CONF=/opt/mailcow-dockerized/data/conf/nginx
            NGX=mailcowdockerized-nginx-mailcow-1
            NET=hrc-center-edge
            cd "${APP_DIR}"
            mkdir -p backups

            echo "▶ 1/5 Load image ${IMAGE}:${APP_TAG}"
            gunzip -c "${IN}/image.tar.gz" | docker load

            echo "▶ 2/5 Write compose file and .env"
            cp "${IN}/docker-compose.yml" docker-compose.yml
            umask 077
            {
              echo "APP_TAG=${APP_TAG}"
              echo "RESEND_API_KEY=${ENV_RESEND_API_KEY:-}"
              echo "CONTACT_TO_EMAIL=${ENV_CONTACT_TO_EMAIL:-}"
              echo "CONTACT_FROM_EMAIL=${ENV_CONTACT_FROM_EMAIL:-}"
              echo "GEMINI_API_KEY=${ENV_GEMINI_API_KEY:-}"
              echo "GEMINI_MODEL=${ENV_GEMINI_MODEL:-}"
              echo "NEXT_PUBLIC_WHATSAPP=${ENV_NEXT_PUBLIC_WHATSAPP:-}"
              echo "NEXT_PUBLIC_ANALYTICS=${ENV_NEXT_PUBLIC_ANALYTICS:-}"
            } > .env
            umask 022

            echo "▶ 3/5 Network (created once, attached to mailcow nginx without restart)"
            docker network inspect "${NET}" >/dev/null 2>&1 || docker network create "${NET}"
            if ! docker inspect "${NGX}" -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | grep -qw "${NET}"; then
              docker network connect "${NET}" "${NGX}"
            fi

            echo "▶ 4/5 Start container"
            docker compose up -d --remove-orphans
            for i in $(seq 1 30); do
              STATE="$(docker inspect -f '{{.State.Health.Status}}' hrc-center-app)"
              [ "${STATE}" = "healthy" ] && { echo "✓ hrc-center-app healthy"; break; }
              if [ "$i" -eq 30 ]; then
                echo "✗ hrc-center-app is ${STATE}"; docker logs --tail 80 hrc-center-app; exit 1
              fi
              sleep 4
            done

            echo "▶ 5/5 mailcow nginx site block"
            if ! cmp -s "${IN}/hrc-center.mailcow.conf" "${MC_CONF}/hrc-center.conf"; then
              if [ ! -f "${MC_CONF}/hrc-center/origin.pem" ]; then
                mkdir -p "${MC_CONF}/hrc-center"
                cp -p "${MC_CONF}/aqar-landing/origin.pem" "${MC_CONF}/aqar-landing/origin.key" "${MC_CONF}/hrc-center/"
              fi
              PREV=""
              if [ -f "${MC_CONF}/hrc-center.conf" ]; then
                PREV="backups/hrc-center.conf.$(date +%Y%m%d%H%M%S)"
                cp -p "${MC_CONF}/hrc-center.conf" "${PREV}"
              fi
              cp "${IN}/hrc-center.mailcow.conf" "${MC_CONF}/hrc-center.conf"
              if docker exec "${NGX}" nginx -t; then
                docker exec "${NGX}" nginx -s reload
                echo "✓ nginx reloaded"
              else
                echo "✗ nginx -t failed — restoring previous site block"
                if [ -n "${PREV}" ]; then cp -p "${PREV}" "${MC_CONF}/hrc-center.conf"; else rm -f "${MC_CONF}/hrc-center.conf"; fi
                docker exec "${NGX}" nginx -t
                exit 1
              fi
            else
              echo "Site block unchanged"
            fi

            sleep 2
            curl -fsS -o /dev/null -k --resolve hrc.novixa.dev:443:127.0.0.1 https://hrc.novixa.dev/ar
            echo "✓ https://hrc.novixa.dev/ar answers through nginx"

            # Keep the 3 newest images of this app only; other images are never touched.
            docker image ls "${IMAGE}" --format '{{.Tag}}' | tail -n +4 | xargs -r -I{} docker rmi "${IMAGE}:{}" || true
            rm -rf "${IN}"
            echo "✓ Deployed ${APP_TAG}"

  audit:
    name: Lighthouse (live site)
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Audit live pages (mobile, median of 3)
        run: |
          npm install -g lighthouse@12.8.2 >/dev/null 2>&1
          LH() { lighthouse "https://hrc.novixa.dev$1" --quiet --form-factor=mobile \
            --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="$2"; }
          # Warm-up: the first audit on a fresh runner pays Chrome/CPU cold-start costs.
          LH /ar /tmp/warmup.json || true
          for p in /ar /en /ar/research /en/contact; do
            n=$(echo "$p" | tr '/' '_')
            for r in 1 2 3; do LH "$p" "lh${n}_$r.json" || echo "::warning::Lighthouse failed on ${p} (run $r)"; done
            python3 - "$p" lh${n}_*.json <<'PY'
          import json, sys
          runs = []
          for f in sys.argv[2:]:
              try:
                  runs.append(json.load(open(f)))
              except Exception:
                  pass
          if not runs:
              sys.exit()
          runs.sort(key=lambda r: r['categories']['performance']['score'] or 0)
          r = runs[len(runs) // 2]  # median by performance
          c = r['categories']; a = r['audits']
          s = ' · '.join(f"{k} {round((v['score'] or 0) * 100)}" for k, v in c.items())
          m = ' · '.join(f"{k} {a[k].get('displayValue', '')}" for k in ('largest-contentful-paint', 'cumulative-layout-shift', 'total-blocking-time'))
          perf = [round((x['categories']['performance']['score'] or 0) * 100) for x in runs]
          print(f"::notice title=Lighthouse {sys.argv[1]}::{s} | {m} | perf runs {perf}")
          bad = [k for k, v in a.items() if v.get('score') is not None and v['score'] < 0.9
                 and v.get('scoreDisplayMode') in ('binary', 'numeric', 'metricSavings')]
          if bad:
              print(f"::warning title=Lighthouse {sys.argv[1]}::{', '.join(bad[:20])}")
          PY
          done
