# Deploy hrc.novixa.dev to the shared Novixa VPS.
#
# Flow: verify (lint + typecheck + unit tests) → build the Docker image on the
#       runner → copy it to the server over SSH → `docker compose up` in
#       /opt/hrc-center → install the site block in mailcow's nginx (only if it
#       changed; `nginx -t` first, previous file restored on failure).
#
# The VPS also hosts mailcow and other Novixa sites. This workflow only touches
# things named hrc-center*: /opt/hrc-center, the hrc-center-app container, the
# hrc-center-edge network and mailcow's conf.d/hrc-center{.conf,/}. nginx is
# reloaded gracefully, never restarted.
#
# Repository secrets: SSH_HOST, SSH_USER, SSH_PASSWORD (or SSH_KEY).
# Optional app secrets: RESEND_API_KEY, GEMINI_API_KEY, CONTACT_TO_EMAIL,
#   CONTACT_FROM_EMAIL, NEXT_PUBLIC_WHATSAPP, NEXT_PUBLIC_ANALYTICS.
# Optional repository variable: GEMINI_MODEL (defaults to gemini-2.5-flash).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  deploy:
    name: Deploy to hrc.novixa.dev
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://hrc.novixa.dev
    env:
      IMAGE: hrc-center-website
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        run: echo "APP_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.APP_TAG }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://hrc.novixa.dev
            NEXT_PUBLIC_WHATSAPP=${{ secrets.NEXT_PUBLIC_WHATSAPP }}
            NEXT_PUBLIC_ANALYTICS=${{ secrets.NEXT_PUBLIC_ANALYTICS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bundle release
        run: |
          mkdir -p release
          docker save "${IMAGE}:${APP_TAG}" | gzip -1 > release/image.tar.gz
          cp deploy/docker-compose.yml deploy/nginx/hrc-center.mailcow.conf release/
          ls -lh release

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          source: release/*
          target: /opt/hrc-center/incoming
          strip_components: 1
          overwrite: true

      - name: Release on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          ENV_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ENV_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENV_GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          ENV_CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL || 'info@hrc-ahgaff.org' }}
          ENV_CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL || 'onboarding@resend.dev' }}
          ENV_NEXT_PUBLIC_WHATSAPP: ${{ secrets.NEXT_PUBLIC_WHATSAPP }}
          ENV_NEXT_PUBLIC_ANALYTICS: ${{ secrets.NEXT_PUBLIC_ANALYTICS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE,APP_TAG,ENV_RESEND_API_KEY,ENV_GEMINI_API_KEY,ENV_GEMINI_MODEL,ENV_CONTACT_TO_EMAIL,ENV_CONTACT_FROM_EMAIL,ENV_NEXT_PUBLIC_WHATSAPP,ENV_NEXT_PUBLIC_ANALYTICS
          script: |
            set -euo pipefail
            APP_DIR=/opt/hrc-center
            IN="${APP_DIR}/incoming"
            MC_CONF=/opt/mailcow-dockerized/data/conf/nginx
            NGX=mailcowdockerized-nginx-mailcow-1
            NET=hrc-center-edge
            cd "${APP_DIR}"
            mkdir -p backups

            echo "▶ 1/5 Load image ${IMAGE}:${APP_TAG}"
            gunzip -c "${IN}/image.tar.gz" | docker load

            echo "▶ 2/5 Write compose file and .env"
            cp "${IN}/docker-compose.yml" docker-compose.yml
            umask 077
            {
              echo "APP_TAG=${APP_TAG}"
              echo "RESEND_API_KEY=${ENV_RESEND_API_KEY:-}"
              echo "CONTACT_TO_EMAIL=${ENV_CONTACT_TO_EMAIL:-}"
              echo "CONTACT_FROM_EMAIL=${ENV_CONTACT_FROM_EMAIL:-}"
              echo "GEMINI_API_KEY=${ENV_GEMINI_API_KEY:-}"
              echo "GEMINI_MODEL=${ENV_GEMINI_MODEL:-}"
              echo "NEXT_PUBLIC_WHATSAPP=${ENV_NEXT_PUBLIC_WHATSAPP:-}"
              echo "NEXT_PUBLIC_ANALYTICS=${ENV_NEXT_PUBLIC_ANALYTICS:-}"
            } > .env
            umask 022

            echo "▶ 3/5 Network (created once, attached to mailcow nginx without restart)"
            docker network inspect "${NET}" >/dev/null 2>&1 || docker network create "${NET}"
            if ! docker inspect "${NGX}" -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | grep -qw "${NET}"; then
              docker network connect "${NET}" "${NGX}"
            fi

            echo "▶ 4/5 Start container"
            docker compose up -d --remove-orphans
            for i in $(seq 1 30); do
              STATE="$(docker inspect -f '{{.State.Health.Status}}' hrc-center-app)"
              [ "${STATE}" = "healthy" ] && { echo "✓ hrc-center-app healthy"; break; }
              if [ "$i" -eq 30 ]; then
                echo "✗ hrc-center-app is ${STATE}"; docker logs --tail 80 hrc-center-app; exit 1
              fi
              sleep 4
            done

            echo "▶ 5/5 mailcow nginx site block"
            if ! cmp -s "${IN}/hrc-center.mailcow.conf" "${MC_CONF}/hrc-center.conf"; then
              if [ ! -f "${MC_CONF}/hrc-center/origin.pem" ]; then
                mkdir -p "${MC_CONF}/hrc-center"
                cp -p "${MC_CONF}/aqar-landing/origin.pem" "${MC_CONF}/aqar-landing/origin.key" "${MC_CONF}/hrc-center/"
              fi
              PREV=""
              if [ -f "${MC_CONF}/hrc-center.conf" ]; then
                PREV="backups/hrc-center.conf.$(date +%Y%m%d%H%M%S)"
                cp -p "${MC_CONF}/hrc-center.conf" "${PREV}"
              fi
              cp "${IN}/hrc-center.mailcow.conf" "${MC_CONF}/hrc-center.conf"
              if docker exec "${NGX}" nginx -t; then
                docker exec "${NGX}" nginx -s reload
                echo "✓ nginx reloaded"
              else
                echo "✗ nginx -t failed — restoring previous site block"
                if [ -n "${PREV}" ]; then cp -p "${PREV}" "${MC_CONF}/hrc-center.conf"; else rm -f "${MC_CONF}/hrc-center.conf"; fi
                docker exec "${NGX}" nginx -t
                exit 1
              fi
            else
              echo "Site block unchanged"
            fi

            sleep 2
            curl -fsS -o /dev/null -k --resolve hrc.novixa.dev:443:127.0.0.1 https://hrc.novixa.dev/ar
            echo "✓ https://hrc.novixa.dev/ar answers through nginx"

            # Keep the 3 newest images of this app only; other images are never touched.
            docker image ls "${IMAGE}" --format '{{.Tag}}' | tail -n +4 | xargs -r -I{} docker rmi "${IMAGE}:{}" || true
            rm -rf "${IN}"
            echo "✓ Deployed ${APP_TAG}"
