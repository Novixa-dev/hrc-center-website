# ==============================================================================
# hrc.novixa.dev — site block for mailcow's nginx on the Novixa VPS.
#
# MANAGED BY CI: .github/workflows/deploy.yml installs this file to
# /opt/mailcow-dockerized/data/conf/nginx/hrc-center.conf whenever it changes,
# runs `nginx -t` and restores the previous file if the test fails, so a bad
# edit can never take down mailcow's nginx. Edit it in the repository.
# ==============================================================================

# Cache-Control by status + path (http-level map, names prefixed to stay unique in mailcow):
# - Next answers unknown file-like paths (/x.png) with its prerendered 404 and
#   s-maxage=31536000, which Cloudflare would pin for a year → never cache a 404.
# - Root icons/brand files get a week instead of the 4 h edge default.
# - Everything else keeps what Next sends.
map "$status|$uri" $hrc_center_cache_control {
    ~^404\|  "no-store";
    "~*^200\|/(favicon\.ico|icon\.svg|apple-touch-icon\.png|icon-(192|512|512-maskable)\.png|brand/[^/]+\.svg)$"  "public, max-age=604800, stale-while-revalidate=86400";
    default  $upstream_http_cache_control;
}

server {
    listen 80;
    server_name hrc.novixa.dev;
    return 301 https://hrc.novixa.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hrc.novixa.dev;

    # Cloudflare Origin Certificate (*.novixa.dev) — this site's own copy.
    ssl_certificate     /etc/nginx/conf.d/hrc-center/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/hrc-center/origin.key;

    # Real visitor IP, believed only from Cloudflare's published ranges.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;

    # Resolved per request through Docker's DNS, so mailcow's nginx still starts
    # when the app container is down (this site then answers 502 instead).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hrc_center_app http://hrc-center-app:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;

    # Immutable build assets
    location /_next/static/ {
        proxy_pass $hrc_center_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass $hrc_center_app;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $hrc_center_cache_control always;
    }
}
